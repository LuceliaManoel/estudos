<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudos 6A</title>
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estudos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#eef1f6;--surface:#fbfcfe;--line:#d5dbe6;--fg:#172033;--muted:#5d6880;
  --ls:91%;--li:27%;--lm:46%;
  --warn:#8a5a00;--warn-soft:#fbecc8;--bad:#b3261e;--bad-soft:#fbe3e1;--ok:#0f7f55;--ok-soft:#d9f1e6;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10141d;--surface:#181e2a;--line:#2b3446;--fg:#e8ecf5;--muted:#98a3ba;--ls:21%;--li:84%;--lm:66%;
  --warn:#f2c462;--warn-soft:#3d2f0e;--bad:#ff8a80;--bad-soft:#45201d;--ok:#6fd6a6;--ok-soft:#143526;color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
p{margin:0}h1,h2,h3{margin:0;font-family:var(--display);letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:650}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 96px);display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}.small{font-size:13.5px}.tiny{font-size:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* categorias */
.c-aula{--h:232}.c-estudo{--h:172}.c-treino{--h:12}.c-refeicao{--h:42}.c-usp{--h:275}.c-rede{--h:325}
.c-pessoal{--h:140}.c-pratica{--h:205}.c-prova{--h:355}.c-rotina{--h:225;--s:10%}.c-agua{--h:198}
.tint{background:hsl(var(--h) var(--s,60%) var(--ls));color:hsl(var(--h) var(--s,60%) var(--li))}
.dot{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) var(--s,60%) var(--lm));flex:none;display:inline-block}

.btn{background:var(--fg);color:var(--bg);border:0;border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:14px}
input[type=text],input[type=date],input[type=time],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px;max-width:100%}

/* alertas */
.alert{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.alert b{font-weight:650}
.alert.late{background:var(--bad-soft);color:var(--bad)}
.alert.tight{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}

/* resumo */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer}
.stat b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.bad b{color:var(--bad)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:4px}

/* temas */
.topic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start}
.topic.done{opacity:.6}
.topic.done .tt{text-decoration:line-through}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;cursor:pointer;display:grid;place-items:center;margin-top:1px}
.check svg{width:16px;height:16px;opacity:0}
.topic.done .check{background:var(--ok);border-color:var(--ok)}
.topic.done .check svg{opacity:1;color:#fff}
.tbody{flex:1;min-width:0;cursor:pointer}
.tt{font-weight:600;overflow-wrap:anywhere}
.tm{font-size:13px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.plain{border:1px solid var(--line);color:var(--muted)}
.slot{display:flex;flex-direction:column;gap:6px}
.slot>.sh{font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.empty{border:1px dashed var(--line);border-radius:14px;padding:14px;color:var(--muted)}

/* agenda */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;position:relative}
.day small{font-size:11px;text-transform:uppercase;color:var(--muted)}
.day b{font:700 18px/1.15 var(--display);font-variant-numeric:tabular-nums}
.day i{width:6px;height:6px;border-radius:50%;background:transparent}
.day i.has{background:hsl(172 60% var(--lm))}.day i.exam{background:var(--bad)}
.day.today b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.day[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day[aria-pressed=true] small{color:inherit;opacity:.7}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.blk{border-radius:12px;padding:9px 12px;display:grid;grid-template-columns:78px 1fr;gap:4px 10px}
.blk time{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.blk .lbl{font-weight:600;overflow-wrap:anywhere;min-width:0}
.blk .in{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.blk.now{outline:2px solid hsl(var(--h) var(--s,60%) var(--lm))}

/* matérias */
details.sub{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
details.sub summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:8px}
details.sub summary::-webkit-details-marker{display:none}
details.sub[open] summary{margin-bottom:10px}
.sline{border-top:1px solid var(--line);padding:9px 0;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* barra de abas */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:10}
nav div{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto;gap:2px}
nav button{background:none;border:0;border-radius:10px;padding:6px 0 4px;color:var(--muted);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav button svg{width:24px;height:24px}
nav button[aria-current=page]{color:var(--fg)}
nav .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;padding:0 5px;min-width:17px;line-height:17px}

/* folha de baixo */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;z-index:30;max-width:calc(100% - 32px);font-size:14.5px}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.water{display:flex;align-items:center;gap:10px}
.cups{display:flex;gap:3px;flex-wrap:wrap}
.cups i{width:12px;height:18px;border-radius:3px 3px 5px 5px;border:1.5px solid hsl(198 60% var(--lm))}
.cups i.f{background:hsl(198 60% var(--lm))}
.hist{display:flex;flex-direction:column;gap:2px}
.hist .hd{font-size:13px;font-weight:650;color:var(--muted);margin-top:8px}
.hl{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
</style>
</head>
<body>
<div class="wrap"><main id="view" class="stack" style="gap:16px"><p class="muted">Carregando…</p></main></div>
<nav aria-label="Páginas"><div id="nav"></div></nav>
<div id="sheet"></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" id="undo">Desfazer</button></div>

<script>
"use strict";
/* ============ utilidades ============ */
const $=id=>document.getElementById(id);
const h=(tag,props={},...kids)=>{const e=document.createElement(tag);for(const k in props){const v=props[k];if(v==null||v===false)continue;
  if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
  else if(k==="html")e.innerHTML=v;else if(k in e&&k!=="list")e[k]=v;else e.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat(9))if(c!=null&&c!==false)e.append(c);return e;};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const plusDays=(s,n)=>iso(addDays(parse(s),n));
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const mm=s=>typeof s==="number"?s:(([a,b])=>a*60+b)(s.split(":").map(Number));
const fm=n=>Math.floor(n/60)+"h"+(n%60?pad(n%60):"");
const dshort=d=>parse(d).toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"");
const dday=d=>parse(d).toLocaleDateString("pt-BR",{day:"numeric",month:"numeric"});
const dlong=d=>parse(d).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const plural=(n,s,p)=>n+" "+(n===1?s:p);
const quando=d=>{const n=diff(d,TODAY);return n===0?"hoje":n===1?"amanhã":n===-1?"ontem":n>1?"em "+n+" dias":"há "+(-n)+" dias";};
const ICON={
  hoje:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>',
  semana:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  materias:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  historico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 3"/></svg>',
  mais:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};

/* ============ estado ============ */
const KEY="estudos-6a-v1";
let S=null, page="hoje", viewDay=null, filtro="all", hist="feito", memo={}, lastUndo=null;
let now=new Date(), TODAY=iso(now), nowMin=now.getHours()*60+now.getMinutes();
const CFG0={len:50,ic:true,goal:8,badge:false};

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("O celular não deixou salvar. Faça um backup em Mais.");}}
async function load(){
  try{S=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){S=null;}
  if(!S){
    const seed=await fetch("seed.json",{cache:"no-cache"}).then(r=>r.json());
    S={v:1,cfg:{...CFG0},grade:seed.grade,subs:seed.subs,tasks:seed.tasks||[],evs:seed.evs||[],water:{},
       assigned:{},moves:[],log:[],started:TODAY};
    save();
  }
  S.cfg={...CFG0,...S.cfg};S.assigned=S.assigned||{};S.moves=S.moves||[];S.log=S.log||[];S.water=S.water||{};
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
}
const allTopics=()=>memo.all||(memo.all=S.subs.flatMap(s=>(s.topics||[]).map(t=>({s,t}))));
const findT=id=>allTopics().find(x=>x.t.id===id);

/* ============ grade e rotina ============ */
const G=()=>S.grade;
function classes(d){const g=G();return g&&g.from<=d&&d<=g.to?(g.days&&g.days[d])||[]:null;}
const dayNote=d=>(G()&&G().notes&&G().notes[d])||"";
function template(d){
  const wd=parse(d).getDay(),B=[],add=(s,e,cat,label,extra)=>{s=mm(s);e=mm(e);if(e>s)B.push({s,e,cat,label,...extra});};
  const C=classes(d),off=C&&G().off&&G().off[d];
  if(wd>=1&&wd<=5){
    const am=C?C.filter(c=>mm(c.s)<720):[],pm=C?C.filter(c=>mm(c.s)>=720):[];
    const pr=C?C.some(c=>c.c==="pratica"):false;
    const turno=(L,s,e,gen,manha)=>{
      if(!C){add(s,e,"aula",gen);return;}
      if(L.length){for(const c of L)add(c.s,c.e,c.c||"aula",c.t,{loc:c.l,cls:1});return;}
      if(off){if(manha)add("08:30","11:30","estudo","Estudo · "+off);return;}
      add(s,e,"estudo","Estudo · horário sem aula");
    };
    turno(am,"08:00","11:30","Aula · manhã",true);
    if(wd===3&&!pr&&S.cfg.ic&&!off){add("11:30","12:00","rotina","Ir para a USP");add("12:00","13:00","usp","Reunião da USP");add("13:00","14:00","refeicao","Almoço");}
    else{add("11:30","12:30","refeicao","Almoço");add("12:30","14:00","estudo","Estudo");}
    turno(pm,"14:00","17:30","Aula · tarde",false);
    const fim=Math.max(1050,...pm.map(c=>mm(c.e)));
    if(wd===1||wd===3||wd===5){
      add(fim,"18:00","rotina","Trânsito");add("18:00","19:00","treino","Treino");add("19:00","19:45","rotina","Banho e jantar");
      if(wd===5)add("19:45","21:15","rede","Projeto da rede social");else add("19:45","21:45","estudo","Estudo em casa");
    }else{
      if(wd===2){add("17:45","18:45","usp","Escrever o projeto da USP");add("18:45","21:00","estudo","Estudo na biblioteca");}
      else add("17:45","21:00","estudo","Estudo na biblioteca");
      add("21:00","21:40","rotina","Voltar para casa");
    }
  }else if(wd===6){
    add("08:00","09:00","treino","Treino");add("09:30","11:00","usp","Escrever o projeto da USP");add("11:00","12:30","estudo","Estudo");
    add("12:30","13:30","refeicao","Almoço");add("14:00","17:00","estudo","Estudo");
  }else{
    add("10:00","11:30","rede","Projeto da rede social");add("16:00","18:00","estudo","Revisão da semana");add("18:00","18:30","rotina","Planejar a semana");
  }
  return B;
}
function dayBlocks(d){
  memo.days=memo.days||new Map();if(memo.days.has(d))return memo.days.get(d);
  const evs=(S.evs||[]).filter(e=>e.date===d).map(e=>({s:mm(e.s),e:Math.max(mm(e.e),mm(e.s)+15),cat:e.cat,label:e.title,ev:e.id}));
  let out=[];
  for(const b of template(d)){
    let parts=[[b.s,b.e]];
    for(const e of evs)parts=parts.flatMap(([s,x])=>e.e<=s||e.s>=x?[[s,x]]:[[s,e.s],[e.e,x]]);
    for(const[s,x]of parts)if(x-s>=20)out.push({...b,s,e:x});
  }
  out=out.concat(evs).sort((a,b)=>a.s-b.s);memo.days.set(d,out);return out;
}
/* avaliações = aulas da grade marcadas como prova + P2 e AV2 */
function exams(){
  if(memo.exams)return memo.exams;const out=[],g=G();
  if(g)for(const d in g.days)for(const c of g.days[d])if(c.c==="prova")out.push({date:d,title:c.t,s:mm(c.s)});
  out.push({date:"2026-12-01",title:"P2 (1 a 4/12)",s:420},{date:"2026-12-07",title:"AV2",s:420});
  return memo.exams=out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.s-b.s);
}

/* ============ planejamento ============ */
function deadline(s,t){const c=[];if(t.due)c.push(t.due);if(t.blk==="pos"&&s.p2)c.push(s.p2);if(s.av2)c.push(s.av2);return c.filter(x=>x>=TODAY).sort()[0]||"9999";}
const ready=(t,d,b)=>t.pin===d||!t.from||t.from<d||(t.from===d&&b.s>=1020);
function plan(){
  if(memo.plan)return memo.plan;
  const pend=[];S.subs.forEach((s,si)=>(s.topics||[]).forEach((t,ti)=>{if(!t.done)pend.push({s,t,ti,si,dl:deadline(s,t)});}));
  pend.sort((a,b)=>((b.t.pin===TODAY)-(a.t.pin===TODAY))||(a.dl<b.dl?-1:a.dl>b.dl?1:0)||(a.ti-b.ti)||(a.si-b.si));
  const slot=new Map(),when=new Map(),len=Math.max(20,+S.cfg.len||50);
  let cap=new Map();
  for(let i=0;i<150&&pend.length;i++){
    const d=plusDays(TODAY,i);
    for(const b of dayBlocks(d)){
      if(b.cat!=="estudo")continue;let s=b.s;
      if(i===0){if(b.e<=nowMin+15)continue;s=Math.max(s,nowMin);}
      let c=Math.max(1,Math.floor((b.e-s)/len));cap.set(d,(cap.get(d)||0)+c);
      while(c-->0){
        const k=pend.findIndex(p=>(i>0||p.t.skip!==TODAY)&&ready(p.t,d,b));if(k<0)break;
        const p=pend.splice(k,1)[0],key=d+"|"+b.s;
        if(!slot.has(key))slot.set(key,[]);slot.get(key).push(p);when.set(p.t.id,d);
      }

    if(d<TODAY){x.t.n=(x.t.n||0)+1;S.moves.push({id,from:d,at:TODAY,why:"auto"});delete S.assigned[id];n++;}
