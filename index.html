<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vida da Lu</title>
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1b17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vida da Lu">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f1e8;--surface:#fffdf8;--line:#e2dac8;--fg:#1f3b33;--muted:#5f6f67;--gold:#a8822f;--gold-soft:#f3e7c8;--brand:#1f3b33;--on-brand:#f7efd9;
  --ls:91%;--li:27%;--lm:44%;
  --warn:#8a5a00;--warn-soft:#fbecc8;--bad:#b3261e;--bad-soft:#fbe3e1;--ok:#0f7f55;--ok-soft:#d9f1e6;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1b17;--surface:#16261f;--line:#2a3d34;--fg:#efe6cf;--muted:#a3b2a8;--gold:#e0bf74;--gold-soft:#3a3120;--brand:#e0bf74;--on-brand:#14231d;--ls:21%;--li:84%;--lm:66%;
  --warn:#f2c462;--warn-soft:#3d2f0e;--bad:#ff8a80;--bad-soft:#45201d;--ok:#6fd6a6;--ok-soft:#143526;color-scheme:dark}}
@font-face{font-family:"LuScript";src:url("fonts/chorus.woff") format("woff");font-display:swap}
@font-face{font-family:"LuSans";src:url("fonts/poppins-medium.woff") format("woff");font-weight:500;font-display:swap}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
p{margin:0}h1,h2,h3{margin:0;font-family:var(--display);letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:650}
.wrap{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 96px);display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}.small{font-size:13.5px}.tiny{font-size:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}

.c-aula{--h:232}.c-estudo{--h:172}.c-treino{--h:12}.c-refeicao{--h:42}.c-usp{--h:275}.c-rede{--h:325}
.c-pessoal{--h:140}.c-pratica{--h:205}.c-prova{--h:355}.c-rotina{--h:225;--s:10%}.c-agua{--h:198}
.tint{background:hsl(var(--h) var(--s,60%) var(--ls));color:hsl(var(--h) var(--s,60%) var(--li))}
.dot{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) var(--s,60%) var(--lm));flex:none;display:inline-block}

.btn{background:var(--brand);color:var(--on-brand);border:0;border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:14px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px;max-width:100%}

.alert{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.alert b{font-weight:650}
.alert.late{background:var(--bad-soft);color:var(--bad)}
.alert.tight{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer}
.stat b{display:block;font:700 28px/1.1 var(--display);color:var(--fg);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.bad b{color:var(--bad)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#d9b56c);border-radius:4px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{border:0;border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:76px}
.tile b{font:700 17px/1.2 var(--display)}.tile span{font-size:13px;opacity:.9}

.topic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start}
.topic.done{opacity:.6}
.topic.done .tt{text-decoration:line-through}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;cursor:pointer;display:grid;place-items:center;margin-top:1px;padding:0}
.check svg{width:16px;height:16px;opacity:0}
.done .check,.check.on{background:var(--ok);border-color:var(--ok)}
.done .check svg,.check.on svg{opacity:1;color:#fff}
.tbody{flex:1;min-width:0;cursor:pointer}
.tt{font-weight:600;overflow-wrap:anywhere}
.tm{font-size:13px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.plain{border:1px solid var(--line);color:var(--muted)}
.slot{display:flex;flex-direction:column;gap:6px}
.slot>.sh{font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.empty{border:1px dashed var(--line);border-radius:14px;padding:14px;color:var(--muted)}

.brandbar{display:flex;align-items:center;gap:11px;background:#1f3b33;color:#f7efd9;border-radius:18px;padding:10px 10px 10px 12px}
.brandbar .lm{width:44px;height:44px;border-radius:50%;border:1.5px solid #d9b56c;display:grid;place-items:center;font:400 22px/1 "LuScript",var(--display);color:#e8c983;flex:none;padding-top:2px}
.brandbar b{font:400 27px/1 "LuScript",var(--display);display:block;color:#f7efd9}.brandbar small{display:block;font:500 10px/1 "LuSans",var(--font);letter-spacing:.3em;text-transform:uppercase;color:#d9b56c;margin-top:5px}
.brandbar .iconbtn{background:transparent;border-color:rgba(217,181,108,.55);color:#e8c983;margin-left:auto}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.day small{font-size:11px;text-transform:uppercase;color:var(--muted)}
.day b{font:700 18px/1.15 var(--display);font-variant-numeric:tabular-nums}
.day i{width:6px;height:6px;border-radius:50%;background:transparent}
.day i.has{background:hsl(172 60% var(--lm))}.day i.exam{background:var(--bad)}
.day.today b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.day[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.day[aria-pressed=true] small{color:inherit;opacity:.7}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.blk{border-radius:12px;padding:9px 12px;display:grid;grid-template-columns:78px 1fr auto;gap:4px 10px;align-items:start}
.blk time{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.blk .lbl{font-weight:600;overflow-wrap:anywhere;min-width:0}
.blk .in{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.blk.now{outline:2px solid hsl(var(--h) var(--s,60%) var(--lm))}
.blk .mini{background:var(--surface);color:var(--fg);border:0;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}

details.sub{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
details.sub summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:8px}
details.sub summary::-webkit-details-marker{display:none}
details.sub[open] summary{margin-bottom:10px}
details.sub .topic{margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip .n{font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:10}
@supports (backdrop-filter:blur(1px)){nav{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}}
nav div{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto;gap:2px}
nav button{background:none;border:0;border-radius:10px;padding:6px 0 4px;color:var(--muted);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav button svg{width:24px;height:24px}
nav button[aria-current=page]{color:var(--gold)}
nav button[aria-current=page] svg{stroke-width:2.4}
nav .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;padding:0 5px;min-width:17px;line-height:17px}

#water{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;border-radius:14px;padding:9px 10px 9px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:680px;max-height:88vh;overflow:auto;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);background:var(--brand);color:var(--on-brand);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;z-index:30;max-width:calc(100% - 32px);font-size:14.5px}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.cups{display:flex;gap:3px;flex-wrap:wrap}
.cups i{width:12px;height:18px;border-radius:3px 3px 5px 5px;border:1.5px solid hsl(198 60% var(--lm))}
.cups i.f{background:hsl(198 60% var(--lm))}
.bignum{font:700 64px/1 var(--display);font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.bars i{width:100%;border-radius:6px 6px 2px 2px;background:hsl(var(--h) 60% var(--lm));min-height:3px}
.wk{display:flex;gap:6px}
.wk span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.wk b{display:grid;place-items:center;height:30px;border-radius:9px;border:1.5px dashed var(--line);font-size:13px;color:var(--muted);margin-top:3px}
.wk b.y{background:hsl(12 60% var(--lm));border:0;color:#fff}.wk b.n{border-style:solid}
.wk b.off{border:0}
.hl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hd{font-size:13px;font-weight:650;color:var(--muted);margin-top:10px}
.sync{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync i.ok{background:var(--ok)}.sync i.bad{background:var(--bad)}.sync i.warn{background:#d39b20}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
code{font-size:13px;background:var(--bg);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">
  <div id="water" class="c-agua tint" hidden><span>Hora de beber água</span><button class="btn sm" type="button" id="waterBtn">Bebi um copo</button></div>
  <main id="view" class="stack" style="gap:16px"><p class="muted">Carregando…</p></main>
</div>
<nav aria-label="Páginas"><div id="nav"></div></nav>
<div id="sheet"></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" id="undo">Desfazer</button></div>

<script>
"use strict";
/* ================= utilidades ================= */
const $=id=>document.getElementById(id);
const h=(tag,props={},...kids)=>{const e=document.createElement(tag);for(const k in props){const v=props[k];if(v==null||v===false)continue;
  if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
  else if(k==="html")e.innerHTML=v;else if(k in e&&k!=="list")e[k]=v;else e.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat(9))if(c!=null&&c!==false)e.append(c);return e;};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const plusDays=(s,n)=>iso(addDays(parse(s),n));
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const mm=s=>typeof s==="number"?s:(([a,b])=>a*60+b)(s.split(":").map(Number));
const fm=n=>Math.floor(n/60)+"h"+(n%60?pad(n%60):"");
const dshort=d=>parse(d).toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"");
const dday=d=>parse(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
const dlong=d=>parse(d).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
const wdShort=d=>parse(d).toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const plural=(n,s,p)=>n+" "+(n===1?s:p);
const quando=d=>{const n=diff(d,TODAY);return n===0?"hoje":n===1?"amanhã":n===-1?"ontem":n>1?"em "+n+" dias":"há "+(-n)+" dias";};
const stamp=o=>{o.u=Date.now();return o;};
const RATE={facil:"fácil",ok:"razoável",dificil:"difícil"};
const ICON={
  hoje:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  agenda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  estudos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  projetos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>',
  agua:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7S5 10 5 14.5a7 7 0 0 0 14 0C19 10 12 2.7 12 2.7z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};

/* ================= estado ================= */
const KEY="estudos-6a-v1", TOKEN_KEY="estudos-6a-token", REPO="LuceliaManoel/estudos-dados", FILE="dados.json";
const CFG0={len:50,ic:true,goal:8,badge:false,u:0};
let S=null,page="hoje",viewDay=null,estTab="plano",filtro="pend",hist="feito",area="acad",memo={},lastUndo=null;
let now=new Date(),TODAY=iso(now),nowMin=now.getHours()*60+now.getMinutes();
let syncState={st:"off",msg:"Sincronização desligada",at:0},syncTimer=null,syncing=null;

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("O aparelho não deixou salvar. Faça um backup em Ajustes.");}}
function migrate(x){
  x.cfg={...CFG0,...(x.cfg||{})};x.subs=x.subs||[];x.tasks=x.tasks||[];x.evs=x.evs||[];x.moves=x.moves||[];x.assigned=x.assigned||{};
  const w=x.water||{};x.water={};for(const k in w)x.water[k]=typeof w[k]==="number"?{n:w[k],u:0}:w[k];
  x.treino=x.treino||{};
  for(const m of x.moves)if(!m.k)m.k=m.id+"|"+m.from;
  if(x.log){for(const l of x.log){const t=x.subs.flatMap(s=>s.topics).find(t=>t.id===l.id);if(t&&t.done&&!t.rate)t.rate=l.rate||"";}delete x.log;}
  if(x.v!==2){x.v=2;delete x.lastWater;}
  return x;
}
async function load(){
  try{S=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){S=null;}
  if(!S){
    const seed=await fetch("seed.json",{cache:"no-cache"}).then(r=>r.json());
    S={v:2,cfg:{...CFG0},grade:seed.grade,subs:seed.subs,tasks:seed.tasks||[],evs:seed.evs||[],water:{},treino:{},moves:[],assigned:{},started:TODAY};
  }

const allTopics=()=>memo.all||(memo.all=S.subs.flatMap(s=>(s.topics||[]).map(t=>({s,t}))));

function dayBlocks(d){
  memo.days=memo.days||new Map();if(memo.days.has(d))return memo.days.get(d);
  const evs=liveEvs().filter(e=>e.date===d).map(e=>({s:mm(e.s),e:Math.max(mm(e.e),mm(e.s)+15),cat:e.cat,label:e.title,ev:e.id}));
  let out=[];
  for(const b of template(d)){
    let parts=[[b.s,b.e]];
    for(const e of evs)parts=parts.flatMap(([s,x])=>e.e<=s||e.s>=x?[[s,x]]:[[s,e.s],[e.e,x]]);
    for(const[s,x]of parts)if(x-s>=20)out.push({...b,s,e:x});
  }
  out=out.concat(evs).sort((a,b)=>a.s-b.s);memo.days.set(d,out);return out;
}
function exams(){
  if(memo.exams)return memo.exams;const out=[],g=G();

  out.push({date:"2026-12-01",title:"P2 (1 a 4/12)",s:420},{date:"2026-12-07",title:"AV2",s:420});
  for(const e of liveEvs())if(e.cat==="prova")out.push({date:e.date,title:e.title,s:mm(e.s)});
  return memo.exams=out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.s-b.s);
}

/* ================= planejamento dos estudos ================= */
function deadline(s,t){const c=[];if(t.due)c.push(t.due);if(t.blk==="pos"&&s.p2)c.push(s.p2);if(s.av2)c.push(s.av2);return c.filter(x=>x>=TODAY).sort()[0]||"9999";}

  pend.sort((a,b)=>((b.t.pin===TODAY)-(a.t.pin===TODAY))||(a.dl<b.dl?-1:a.dl>b.dl?1:0)||(a.ti-b.ti)||(a.si-b.si));

    const d=plusDays(TODAY,i);
    for(const b of dayBlocks(d)){
      if(b.cat!=="estudo")continue;let s=b.s;
      if(i===0){if(b.e<=nowMin+15)continue;s=Math.max(s,nowMin);}
      let c=Math.max(1,Math.floor((b.e-s)/len));
      while(c-->0){
        const k=pend.findIndex(p=>(i>0||p.t.skip!==TODAY)&&ready(p.t,d,b));if(k<0)break;
        const p=pend.splice(k,1)[0],key=d+"|"+b.s;
        if(!slot.has(key))slot.set(key,[]);slot.get(key).push(p);when.set(p.t.id,d);

/* tema que estava marcado para um dia que passou e não foi estudado vira "remarcado" */
function reconcile(){
  let n=0;const seen=new Set(S.moves.map(m=>m.k));
  for(const id in S.assigned){
    const d=S.assigned[id],x=findT(id);
    if(!x||x.t.done){delete S.assigned[id];continue;}
    if(d<TODAY){
      const k=id+"|"+d;
      if(!seen.has(k)){stamp(x.t);x.t.n=(x.t.n||0)+1;S.moves.push({id,from:d,at:TODAY,why:"auto",k});seen.add(k);n++;}
      delete S.assigned[id];
    }
  }
  memo={};const {when}=plan();
  for(const[id,d]of when)S.assigned[id]=d;
  if(n)S.lastRe={date:TODAY,n:((S.lastRe&&S.lastRe.date===TODAY)?S.lastRe.n:0)+n};
  save();return n;
}
function alerts(){
  if(memo.alerts)return memo.alerts;
  const {when}=plan(),groups=new Map(),out=[];
  for(const{s,t}of allTopics()){if(t.done)continue;const dl=deadline(s,t);if(dl==="9999")continue;
    if(!groups.has(dl))groups.set(dl,[]);groups.get(dl).push({s,t});}
  const short=t=>t.replace(/\s*\(.*?\)/g,"").replace(/^.*?:\s*/,"").replace(/^.*\+\s*/,"");
  const exName=d=>{const e=exams().filter(e=>e.date===d);return e.length?e.map(e=>short(e.title)).join(" + "):"Prova de "+dday(d);};
  for(const[date,L]of[...groups].sort((a,b)=>a[0]<b[0]?-1:1)){
    const days=diff(date,TODAY);
    const late=L.filter(x=>!when.get(x.t.id)||when.get(x.t.id)>=date);
    const last=L.map(x=>when.get(x.t.id)||"9999").sort().pop();
    const st=late.length?"late":diff(date,last)<=1?"tight":"ok";
    if(st!=="late"&&days>10)continue;
    let txt;
    if(st==="late"){
      const per=Math.ceil(late.length/Math.max(1,days));
      txt="Não vai dar tempo no ritmo atual: "+plural(late.length,"tema não cabe","temas não cabem")+" antes da prova. Estude mais "+plural(per,"tema","temas")+" por dia, ou diminua o tempo por tema em Ajustes.";
    }else if(st==="tight")txt="Tempo curto: o último tema só fica pronto "+(last===TODAY?"hoje":"em "+dshort(last))+". Não deixe nada para remarcar.";
    else txt="No ritmo: "+plural(L.length,"tema pendente","temas pendentes")+", tudo cabe até "+dshort(last)+".";
    out.push({date,st,title:exName(date)+" "+quando(date),txt});

/* ================= sincronização (GitHub) ================= */
const token=()=>{try{return localStorage.getItem(TOKEN_KEY)||"";}catch(e){return "";}};
const b64e=s=>{const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r);};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const shared=x=>({v:2,cfg:x.cfg,subs:x.subs,tasks:x.tasks,evs:x.evs,water:x.water,treino:x.treino,moves:x.moves,started:x.started});
function byId(a,b,merge){const m=new Map();for(const x of a||[])m.set(x.id,x);
  for(const y of b||[]){const x=m.get(y.id);m.set(y.id,!x?y:merge?merge(x,y):((y.u||0)>(x.u||0)?y:x));}return [...m.values()];}
function mergeState(L,R){

  out.cfg=(R.cfg&&(R.cfg.u||0)>(L.cfg.u||0))?{...CFG0,...R.cfg}:L.cfg;
  out.subs=byId(L.subs,R.subs,(a,b)=>{const base=(b.u||0)>(a.u||0)?b:a;return {...base,topics:byId(a.topics,b.topics)};});
  out.tasks=byId(L.tasks,R.tasks);out.evs=byId(L.evs,R.evs);
  const perDay=(a={},b={})=>{const o={...a};for(const k in b)if(!o[k]||(b[k].u||0)>(o[k].u||0))o[k]=b[k];return o;};
  out.water=perDay(L.water,R.water);out.treino=perDay(L.treino,R.treino);
  const mv=new Map();for(const m of [...(L.moves||[]),...(R.moves||[])])if(!mv.has(m.k))mv.set(m.k,m);out.moves=[...mv.values()];

function setSync(st,msg){syncState={st,msg,at:st==="ok"?Date.now():syncState.at};const el=document.getElementById("syncline");if(el)el.replaceWith(syncLine());}
async function gh(method,body,sha){
  const url="https://api.github.com/repos/"+REPO+"/contents/"+FILE+(method==="GET"?"?t="+Date.now():"");
  const r=await fetch(url,{method,cache:"no-store",headers:{Authorization:"Bearer "+token(),Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(body?{"Content-Type":"application/json"}:{})},
    body:body?JSON.stringify({message:"Atualiza dados do app",content:b64e(body),...(sha?{sha}:{})}):undefined});
  return r;
}
async function syncNow(){
  if(!token()){setSync("off","Sincronização desligada");return;}
  if(syncing)return syncing;
  syncing=(async()=>{
    if(!navigator.onLine){setSync("warn","Sem internet. Sincroniza quando voltar.");return;}
    setSync("busy","Sincronizando…");
    try{
      for(let attempt=0;attempt<2;attempt++){
        const r=await gh("GET");let sha=null,remote=null;
        if(r.status===200){const j=await r.json();sha=j.sha;remote=JSON.parse(b64d(j.content));}
        else if(r.status===401||r.status===403){setSync("bad","A chave do GitHub não funcionou. Confira em Ajustes.");return;}
        else if(r.status===404){const rr=await fetch("https://api.github.com/repos/"+REPO,{cache:"no-store",headers:{Authorization:"Bearer "+token()}});
          if(rr.status!==200){setSync("bad","Não achei o repositório estudos-dados. Confira o nome e a chave.");return;}}
        else{setSync("warn","O GitHub não respondeu ("+r.status+"). Tento de novo depois.");return;}
        const before=JSON.stringify(shared(S));
        if(remote){S=migrate({...mergeState(S,migrate(remote)),grade:S.grade,assigned:S.assigned,lastRe:S.lastRe});}
        reconcile();
        const mine=JSON.stringify(shared(S));
        if(before!==mine){memo={};render();}
        if(remote&&mine===JSON.stringify(shared(migrate(remote)))){setSync("ok","Sincronizado");return;}
        const p=await gh("PUT",mine,sha);
        if(p.status===200||p.status===201){setSync("ok","Sincronizado");return;}
        if(p.status===409||p.status===422)continue;
        if(p.status===401||p.status===403){setSync("bad","A chave não tem permissão para salvar. Ela precisa de Contents: Read and write.");return;}
        setSync("warn","Não consegui salvar no GitHub ("+p.status+"). Tento de novo depois.");return;
      }
      setSync("warn","Os dois aparelhos salvaram ao mesmo tempo. Tento de novo em instantes.");queueSync(4000);
    }catch(e){setSync("warn",navigator.onLine?"Falha ao falar com o GitHub. Tento de novo depois.":"Sem internet. Sincroniza quando voltar.");}
  })().finally(()=>{syncing=null;});
  return syncing;
}
function queueSync(ms){if(!token())return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,ms||1500);}

      navigator.setAppBadge?h("label",{class:"row between"},h("span",{},"Mostrar no ícone quantos temas faltam hoje"),h("input",{type:"checkbox",checked:!!c.badge,style:"width:24px;height:24px",onchange:async e=>{
        if(e.target.checked&&window.Notification&&Notification.permission!=="granted"){try{await Notification.requestPermission();}catch(_){}}
        set({badge:e.target.checked});if(!e.target.checked)try{navigator.clearAppBadge();}catch(_){}}})):null),
    h("section",{class:"card stack"},h("h3",{},"Backup"),
      h("p",{class:"small muted"},tk?"Com a sincronização ligada, seus dados já ficam guardados no GitHub. O backup é uma cópia extra.":"Sem a sincronização, tudo fica só neste aparelho. Faça um backup de vez em quando."),
      h("div",{class:"row"},h("button",{type:"button",class:"btn ghost",onclick:exportData},"Salvar backup"),
        h("label",{class:"btn ghost",style:"display:inline-flex;align-items:center"},"Restaurar backup",h("input",{type:"file",accept:"application/json,.json",style:"display:none",onchange:importData})))),
    h("p",{class:"tiny muted"},"Vida da Lu · turma 6A, metade A1 · cronograma do Módulo 6 2026-2.")];
}};
async function exportData(){
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"}),name="vida-da-lu-backup-"+TODAY+".json";
  try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Backup Vida da Lu"});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  const a=h("a",{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();
}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.subs||!d.grade)throw 0;
  if(!confirm("Substituir os dados deste aparelho pelo backup?"))return;S=migrate(d);const t=Date.now();for(const x of allTopics())x.t.u=t;memo={};save();reconcile();commit("Backup restaurado");}catch(_){toast("Esse arquivo não é um backup do app.");}};r.readAsText(f);}

/* ================= navegação ================= */
const TABS=[["hoje","Início"],["agenda","Agenda"],["estudos","Estudos"],["projetos","Projetos"],["agua","Água"]];
function go(p){page=p;if(p==="agenda")viewDay=TODAY;render();scrollTo(0,0);}
function waterBanner(){const w=S.water[TODAY]||{},hr=new Date().getHours(),lastAny=Math.max(0,...Object.values(S.water).map(x=>x.last||0));
  $("water").hidden=!(page!=="agua"&&hr>=7&&hr<22&&(w.n||0)<S.cfg.goal&&Date.now()-lastAny>36e5);}
$("waterBtn").onclick=()=>drink(1);
function render(){
  now=new Date();const t=iso(now);if(t!==TODAY){TODAY=t;memo={};reconcile();queueSync(300);}
  nowMin=now.getHours()*60+now.getMinutes();
  const re=stats().remarc;
  $("nav").replaceChildren(...TABS.map(([k,l])=>h("button",{type:"button","aria-current":page===k||(k==="hoje"&&page==="ajustes")?"page":null,onclick(){go(k);}},
    h("span",{html:ICON[k],style:"display:contents"}),l,k==="estudos"&&re?h("span",{class:"badge"},String(re)):null)));
  $("view").replaceChildren(...P[page]().flat().filter(Boolean));
  waterBanner();setBadge();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){memo={};render();queueSync(200);}});
setInterval(()=>{if(!document.hidden&&!$("sheet").firstChild&&!document.activeElement.matches("input,select,textarea")){memo={};render();}},60000);
setInterval(()=>{if(!document.hidden)queueSync(10);},5*60000);
(async()=>{
  try{await load();}catch(e){$("view").replaceChildren(h("div",{class:"alert late"},h("b",{},"Não consegui carregar os dados."),h("span",{class:"small"},"Abra de novo com internet na primeira vez.")));return;}
  reconcile();render();
  if(token())syncNow();
  if("serviceWorker" in navigator){
    let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded)return;reloaded=true;location.reload();});
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
